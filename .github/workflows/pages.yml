name: site

# Builds the public site (site/build.py: one self-contained page from site/src/ and the committed out/public/)
# and publishes it on GitHub Pages. Nothing is computed here: every number on the page is read from out/public/,
# which is rebuilt and committed with public_data.py. Repository setting needed once: Settings > Pages > Source:
# GitHub Actions (with "Deploy from a branch", GitHub's own build renders the README instead and overwrites this).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "out/public/**"
      - "docs/SOURCES.md"
      - "prompts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nothing private in what is published
        run: python3 scripts/check_private.py --publish
      - name: Build the page
        run: |
          python3 site/build.py --out _site/index.html
          cp CNAME _site/CNAME   # the custom domain (benchmark.learningdesignalliance.org)
      # The speech section's dataset citation was dropped by a stray script three times; refuse to publish without it.
      - name: Every cited source key is in docs/SOURCES.md, and the speech citation is present
        run: |
          python3 - <<'EOF'
          import re, sys
          page = open("_site/index.html", encoding="utf-8").read()
          page = re.sub(r"<script\b.*?</script>", "", page, flags=re.S)  # cites are in the markup; ignore code comments
          keys = set(re.findall(r"^- \[(\w+)\]", open("docs/SOURCES.md", encoding="utf-8").read(), re.M))
          used = set(re.findall(r'data-ref="(\w+)"', page))
          missing = sorted(used - keys)
          if missing:
              sys.exit(f"cited but not in docs/SOURCES.md: {missing}")
          if "speechocean" not in used:
              sys.exit("the speechocean762 citation is missing from the speech section")
          print(f"{len(used)} cited sources, all in docs/SOURCES.md")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
